name: gravityerd

x-node-limits: &node-limits
  init: true
  restart: "no"
  cpus: "${GRAVITYERD_NODE_CPUS:-1.0}"
  mem_limit: "${GRAVITYERD_NODE_MEMORY:-512m}"
  pids_limit: 256
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 10s

services:
  web:
    <<: *node-limits
    image: node:26-bookworm-slim
    working_dir: /workspace
    command: ["sh", "-c", "npm run examples && npm run build && npm run serve"]
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
    ports:
      - "127.0.0.1:${GRAVITYERD_PORT:-18116}:8080"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - npm_cache:/root/.npm
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 60s

  node:
    <<: *node-limits
    image: node:26-bookworm-slim
    working_dir: /workspace
    profiles: ["tools"]
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - npm_cache:/root/.npm

  playwright:
    init: true
    restart: "no"
    cpus: "${GRAVITYERD_PLAYWRIGHT_CPUS:-2.0}"
    mem_limit: "${GRAVITYERD_PLAYWRIGHT_MEMORY:-1g}"
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 10s
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /workspace
    profiles: ["test"]
    environment:
      BASE_URL: http://web:8080
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    depends_on:
      web:
        condition: service_healthy
    command: ["npx", "playwright", "test", "--config", "app/playwright.config.mjs"]

volumes:
  node_modules:
  npm_cache:
